# LLM host (the GPU PC): Ollama with the NVIDIA GPU, plus a one-shot job that pulls the models.
# Run on that machine with `docker compose -f deploy/llm/compose.yaml --env-file deploy/llm/.env
# up -d` (Windows 11 + Docker Desktop/WSL2), or `make llm-up` (Linux with the NVIDIA Container
# Toolkit). The file is the same on both; see the README.
#
# Ollama has no authentication: publish it on the PC's LAN address only and firewall port 11434
# to the app host. Never publish it on 0.0.0.0 or to the internet.
#
# The project network has the fixed name `paper-trail-llm`. When one machine runs both stacks,
# deploy/single-host/compose.override.yaml attaches the app's worker to it, so the worker reaches
# Ollama at http://ollama:11434 without any published port (PLAN 2.4a).
name: paper-trail-llm

services:
  ollama:
    image: ollama/ollama:0.40.15
    ports:
      - "${OLLAMA_BIND_ADDR:-127.0.0.1}:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Keep at most one model in the 3080's 10 GB of VRAM at a time.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.40.15
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Must match PAPER_TRAIL_OLLAMA__{TEXT,VISION,EMBED}_MODEL on the app host.
      TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-qwen2.5:7b-instruct}
      VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for model in "$$TEXT_MODEL" "$$VISION_MODEL" "$$EMBED_MODEL"; do
          echo "pulling $$model"
          ollama pull "$$model"
        done
    restart: "no"

networks:
  default:
    name: paper-trail-llm

volumes:
  ollama-models:
